server:
  listen_address: ":8080"

docker:
  host: "unix:///var/run/docker.sock"

limits:
  recent_capacity: 500
  client_queue_capacity: 256
  sse_keepalive: 15s
  reconnect_min: 1s
  reconnect_max: 30s
  max_sse_clients: 100
  ingest_max_body_bytes: 1048576
  ingest_max_batch: 100
  max_event_bytes: 1048576

sources:
  - name: messenger-api
    type: docker
    container_name: messenger-api

  - name: messenger-worker
    type: compose
    compose_project: whatsapp
    compose_service: worker

  - name: host-service
    type: file
    path: /var/log/host-service.log

  - name: external-app
    type: http

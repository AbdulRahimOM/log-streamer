name: Deploy LogStreamer to EC2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ec2-logstreamer-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    env:
      IMAGE_TAG: ${{ github.sha }}
      EC2_HOST: ${{ vars.EC2_HOST }}
      DEPLOY_DIRECTORY: ${{ vars.LOGSTREAMER_DEPLOY_DIRECTORY }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || 'abdulrahimom' }}

    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4

      - name: Validate deployment settings
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in EC2_HOST DEPLOY_DIRECTORY DOCKERHUB_USERNAME SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub Environment setting: $name" >&2
              exit 1
            fi
          done
          case "$DEPLOY_DIRECTORY" in
            /*) ;;
            *) echo "LOGSTREAMER_DEPLOY_DIRECTORY must be an absolute path" >&2; exit 1 ;;
          esac

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull image and restart Compose service
        run: |
          set -euo pipefail
          ssh "$EC2_HOST" "DEPLOY_DIRECTORY='$DEPLOY_DIRECTORY' IMAGE_TAG='$IMAGE_TAG' DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_DIRECTORY"
          IMAGE_TAG="$IMAGE_TAG" DOCKERHUB_USERNAME="$DOCKERHUB_USERNAME" docker compose -p logstreamer pull
          IMAGE_TAG="$IMAGE_TAG" DOCKERHUB_USERNAME="$DOCKERHUB_USERNAME" docker compose -p logstreamer up -d --no-build
          docker compose -p logstreamer ps
          REMOTE

name: Publish LogStreamer image to Docker Hub

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-logstreamer-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: dev
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || 'abdulrahimom' }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4

      - name: Validate Docker Hub settings
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in the dev environment." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'abdulrahimom' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish LogStreamer image
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --tag "$DOCKERHUB_USERNAME/logstreamer:$IMAGE_TAG" \
            --tag "$DOCKERHUB_USERNAME/logstreamer:latest" \
            --push .

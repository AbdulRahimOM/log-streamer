services:
  logstreamer:
    build:
      context: .
    image: logstreamer:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOGSTREAMER_PORT:-8080}:8080"
    environment:
      LOGSTREAMER_CONFIG: /etc/logstreamer/config.yaml
      LOGSTREAMER_HTTP_ADDR: ":8080"
      LOGSTREAMER_INGEST_TOKEN: "${LOGSTREAMER_INGEST_TOKEN:-}"
    volumes:
      - "${LOGSTREAMER_CONFIG_FILE:-./config.example.yaml}:/etc/logstreamer/config.yaml:ro"
